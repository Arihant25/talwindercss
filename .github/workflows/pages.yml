name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # dist/ is committed so the CDN link works without a build. Rebuild
      # here and fail if the result differs, which catches a src/ edit
      # that was never built.
      - name: Rebuild and check dist is current
        run: |
          node build.mjs
          if ! git diff --quiet -- dist/; then
            echo "dist/ is out of date. Run: node build.mjs"
            git diff --stat -- dist/
            exit 1
          fi

      - name: Check pages
        run: node test/check.mjs

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
